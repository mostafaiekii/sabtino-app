<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>ثبتینو | خدمات ثبتی، کپی و چاپ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ================= تم‌ها ================= */
:root{
  --bg:#eef1f8;--card:#ffffff;--text:#1e293b;--muted:#64748b;--tiny:#94a3b8;
  --border:#e2e8f0;--input:#f8fafc;--soft:#f1f5f9;--glass:rgba(255,255,255,.92);
  --primary:#4f46e5;--primary2:#7c3aed;--primary-soft:#eef2ff;
  --shadow:0 3px 16px rgba(15,23,42,.06);--shadow-lg:0 8px 30px rgba(15,23,42,.14);
}
body[data-theme="dark"]{
  --bg:#0a1120;--card:#121b2e;--text:#e6ecf7;--muted:#94a4c3;--tiny:#6b7a99;
  --border:#233252;--input:#0d1628;--soft:#18233c;--glass:rgba(15,23,42,.92);
  --shadow:0 3px 16px rgba(0,0,0,.35);--shadow-lg:0 8px 30px rgba(0,0,0,.5);
}
body[data-accent="violet"]{--primary:#4f46e5;--primary2:#7c3aed;--primary-soft:#eef2ff}
body[data-accent="blue"]{--primary:#2563eb;--primary2:#0891b2;--primary-soft:#eff6ff}
body[data-accent="green"]{--primary:#059669;--primary2:#0d9488;--primary-soft:#ecfdf5}
body[data-accent="orange"]{--primary:#ea580c;--primary2:#d97706;--primary-soft:#fff7ed}
body[data-theme="dark"][data-accent="violet"]{--primary:#6d6ff5;--primary2:#9b6cf8;--primary-soft:#1f2547}
body[data-theme="dark"][data-accent="blue"]{--primary:#4f8bfa;--primary2:#0ea5c9;--primary-soft:#14243f}
body[data-theme="dark"][data-accent="green"]{--primary:#17b78c;--primary2:#16b3ab;--primary-soft:#0f2c28}
body[data-theme="dark"][data-accent="orange"]{--primary:#fb8432;--primary2:#efa11c;--primary-soft:#2e2214}

/* ================= پایه ================= */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  background:#0c1022;
  background-image:radial-gradient(1200px 600px at 70% -10%,#2c2a6e 0%,transparent 60%),radial-gradient(900px 500px at 10% 110%,#1a1840 0%,transparent 55%);
  color:var(--text);font-size:14px;line-height:1.7;direction:rtl;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:14px;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);outline:none}
input::placeholder,textarea::placeholder{color:var(--tiny)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:0;height:0}
svg{display:block}

/* ================= قاب گوشی ================= */
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{
  position:relative;width:min(430px,calc(100vw - 24px));height:min(890px,calc(100vh - 60px));
  min-height:560px;background:var(--bg);border-radius:38px;border:9px solid #0b0f1a;
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px #1e293b, inset 0 0 0 1px rgba(255,255,255,.06);
  overflow:hidden;transition:background .3s;
}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:24px;background:#0b0f1a;border-radius:0 0 16px 16px;z-index:60}
#view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
#view.hasTab{padding-bottom:86px}
#tabbar{position:absolute;bottom:8px;left:10px;right:10px;height:62px;background:var(--glass);backdrop-filter:blur(14px);border-radius:20px;box-shadow:var(--shadow-lg);display:flex;z-index:50}
#tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tiny);font-size:10px;font-weight:600;position:relative;transition:.2s}
#tabbar .tb svg{width:21px;height:21px}
#tabbar .tb.on{color:var(--primary)}
#tabbar .tb.on::before{content:'';position:absolute;top:6px;width:26px;height:3px;border-radius:3px;background:var(--primary)}
#tabbar .tb .bdg{position:absolute;top:8px;left:calc(50% - 2px);background:#ef4444;color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:800}
.desktop-hint{color:#94a3b8;font-size:11.5px;text-align:center;letter-spacing:.2px}
.desktop-hint b{color:#c7d2fe}
@media(max-width:520px){body{padding:0}.phone{width:100vw;height:100vh;min-height:100vh;border:none;border-radius:0}.notch{display:none}.desktop-hint{display:none}}

/* ================= سربرگ‌ها ================= */
.hh{background:linear-gradient(135deg,var(--primary),var(--primary2) 70%);color:#fff;padding:34px 16px 70px;border-radius:0 0 28px 28px;position:relative;margin-bottom:-50px;overflow:hidden}
.hh::after{content:'';position:absolute;inset:0;background:radial-gradient(340px 150px at 82% 0%,rgba(255,255,255,.16),transparent 70%);pointer-events:none}
.hh-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;position:relative;z-index:1}
.avatar{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;border:1.5px solid rgba(255,255,255,.35)}
.hbell{position:relative;width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.2)}
.hbell svg{width:19px;height:19px}
.hbell .bdg{position:absolute;top:-4px;left:-4px;background:#f59e0b;color:#1e293b;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;padding:0 4px}
.hbell .bdg.hide{display:none}
.hh-greet{font-size:12px;opacity:.85}
.hh-name{font-size:18px;font-weight:800;margin-bottom:12px;position:relative;z-index:1}
.hh-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;position:relative;z-index:1}
.hchip{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:9px 6px;min-height:68px;backdrop-filter:blur(10px);color:#fff;text-align:center;overflow:hidden;transition:.15s}
.hchip:active{transform:scale(.96)}
.hchip .hc-em{font-size:19px;line-height:1.2}
.hchip .hc-l{font-size:9.5px;opacity:.85;font-weight:600}
.hchip .hc-v{font-size:13.5px;font-weight:900;white-space:nowrap}
.hchip.glass{background:rgba(255,255,255,.09);backdrop-filter:blur(16px);border-color:rgba(255,255,255,.4)}
.hchip.glass::after{content:'';position:absolute;top:-30%;bottom:-30%;width:36%;left:-48%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite}
.hchip.pack{background:rgba(251,191,36,.24);border-color:rgba(251,191,36,.45)}
@keyframes shine{0%{left:-48%}44%{left:140%}100%{left:140%}}
.page-h{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.page-h .ttl{font-size:16.5px;font-weight:800}
.page-h .sp{flex:1}
.hback{width:36px;height:36px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.hback svg{width:18px;height:18px;transform:rotate(180deg)}

/* ================= اجزای چیدمان ================= */
.pad{padding:0 16px 24px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card-t{font-size:13.5px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.card-t .sp{flex:1}
.sect-t{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px;font-size:13.5px;font-weight:800}
.sect-t .more{font-size:11px;color:var(--primary);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.muted{color:var(--muted);font-size:12px}
.tiny{font-size:11px;color:var(--tiny)}
.bold{font-weight:800}
.center{text-align:center}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mb10{margin-bottom:10px}
.green{color:#059669}.red{color:#dc2626}.amber{color:#d97706}.indigo{color:var(--primary)}

/* جستجو و فیلترها */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);margin:12px 0}
.search svg{width:17px;height:17px;color:var(--tiny);flex:1 0 auto}
.search input{border:none;background:none;flex:1;color:var(--text)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.chip{white-space:nowrap;background:var(--card);border:1.5px solid var(--border);color:var(--muted);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700;transition:.15s}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(15,23,42,.18)}

/* بنرها */
.banners{display:flex;gap:10px;overflow-x:auto;padding:2px;margin:14px 0 4px;scroll-snap-type:x mandatory}
.banner{min-width:82%;scroll-snap-align:center;border-radius:18px;padding:14px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:88px;position:relative;overflow:hidden;text-align:right}
.banner .b-em{position:absolute;left:10px;top:8px;font-size:44px;opacity:.9}
.banner .b-t{font-weight:800;font-size:14px}
.banner .b-d{font-size:11px;opacity:.85}
.banner .b-cta{font-size:11px;font-weight:800;background:rgba(255,255,255,.2);border-radius:16px;padding:4px 10px;align-self:flex-start;margin-top:6px}
.bn1{background:linear-gradient(120deg,#f59e0b,#ef4444)}
.bn2{background:linear-gradient(120deg,#059669,#0d9488)}
.bn3{background:linear-gradient(120deg,var(--primary),var(--primary2))}

/* شبکه خدمات */
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);position:relative;transition:.15s;border:1.5px solid transparent}
.svc:active{transform:scale(.97)}
.svc .s-em{width:42px;height:42px;border-radius:13px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px}
.svc .s-n{font-weight:800;font-size:12.5px;line-height:1.5;min-height:36px}
.svc .s-p{font-size:12px;color:var(--primary);font-weight:800;margin-top:4px}
.svc .s-b{position:absolute;top:10px;left:10px;font-size:9px;font-weight:800;padding:3px 8px;border-radius:10px}
.b-remote{background:#dcfce7;color:#15803d}
.b-onsite{background:#fef3c7;color:#b45309}
.svc-more{background:var(--soft);border:1.5px dashed var(--border);border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:700;min-height:130px}

/* دکمه‌ها */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:800;width:100%;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(120deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 6px 18px rgba(15,23,42,.22)}
.btn-g{background:linear-gradient(120deg,#059669,#10b981);color:#fff;box-shadow:0 6px 18px rgba(15,23,42,.2)}
.btn-o{background:var(--card);border:1.5px solid var(--border);color:var(--text)}
.btn-d{background:transparent;border:1.5px solid #fca5a5;color:#dc2626}
.btn-s{width:auto;padding:8px 14px;font-size:12px;border-radius:12px}
.btn:disabled{opacity:.45;pointer-events:none}

/* فیلدها */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:var(--input);border:1.5px solid var(--border);border-radius:13px;padding:11px 13px;transition:.15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);background:var(--card)}
.field textarea{min-height:74px;resize:vertical}
.field .hint{font-size:10.5px;color:var(--tiny);margin-top:4px}
.filebox{border:1.5px dashed var(--primary);background:var(--primary-soft);border-radius:13px;padding:14px;text-align:center;color:var(--primary);font-size:12.5px;font-weight:700;display:block;cursor:pointer}
.filebox input{display:none}

/* خلاصه قیمت و پرداخت */
.sumbox{background:var(--soft);border:1.5px solid var(--border);border-radius:16px;padding:12px;font-size:13px}
.sumrow{display:flex;justify-content:space-between;padding:4px 0;gap:10px}
.sumrow.total{border-top:1.5px dashed var(--border);margin-top:6px;padding-top:10px;font-weight:800;font-size:14px}
.payopt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:15px;padding:12px;margin-bottom:9px;transition:.15s;font-weight:700;font-size:13px;cursor:pointer;background:var(--card)}
.payopt.on{border-color:var(--primary);background:var(--primary-soft)}
.payopt .em{font-size:22px}
.payopt small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.radio-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto;position:relative}
.payopt.on .radio-dot{border-color:var(--primary)}
.payopt.on .radio-dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
.bankcard{background:linear-gradient(130deg,#101828,#1e293b);color:#fff;border-radius:18px;padding:15px;position:relative;overflow:hidden;margin-bottom:12px}
.bankcard .bk-row{display:flex;justify-content:space-between;font-size:10.5px;opacity:.8}
.bankcard .bk-no{font-size:17px;font-weight:800;letter-spacing:4px;direction:ltr;text-align:center;margin:10px 0 6px}
.bankcard .bk-h{font-size:11px;opacity:.85;text-align:center}

/* نشان وضعیت */
.stb{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:11px;display:inline-flex;align-items:center;gap:4px}
.st-submitted{background:#e0f2fe;color:#0369a1}
.st-in_review{background:#fef3c7;color:#b45309}
.st-in_progress{background:#ede9fe;color:#6d28d9}
.st-ready{background:#dcfce7;color:#15803d}
.st-delivered{background:#d1fae5;color:#047857}
.st-booked{background:#e0f2fe;color:#0369a1}
.st-attended{background:#d1fae5;color:#047857}
.st-cancelled{background:#fee2e2;color:#b91c1c}
.st-rejected{background:#fee2e2;color:#b91c1c}

/* کارت سفارش */
.ord{background:var(--card);border-radius:18px;padding:13px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;gap:11px;align-items:center}
.ord .o-em{width:46px;height:46px;border-radius:14px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:23px;flex:0 0 auto}
.ord .o-n{font-weight:800;font-size:13px}
.ord .o-m{font-size:11px;color:var(--muted)}

/* تایم‌لاین */
.tl{padding:4px 2px 4px 0}
.tl-item{position:relative;padding:0 30px 20px 0}
.tl-item::before{content:'';position:absolute;right:7px;top:18px;bottom:-2px;width:2.5px;background:var(--border);border-radius:2px}
.tl-item:last-child::before{display:none}
.tl-dot{position:absolute;right:0;top:2px;width:17px;height:17px;border-radius:50%;background:var(--border);border:3px solid var(--bg)}
.tl-item.done .tl-dot{background:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.18)}
.tl-item.cur .tl-dot{background:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(99,102,241,.4)}70%{box-shadow:0 0 0 9px rgba(99,102,241,0)}100%{box-shadow:0 0 0 0 rgba(99,102,241,0)}}
.tl-item .t-n{font-weight:800;font-size:13px;color:var(--tiny)}
.tl-item.done .t-n,.tl-item.cur .t-n{color:var(--text)}
.tl-item .t-d{font-size:10.5px;color:var(--tiny)}

/* کیف پول */
.wallet-card{background:linear-gradient(130deg,var(--primary),var(--primary2) 75%);color:#fff;border-radius:22px;padding:18px;position:relative;overflow:hidden;margin-bottom:12px}
.wallet-card .wc-bg{position:absolute;left:-30px;top:-30px;font-size:120px;opacity:.09}
.wallet-card .wc-l{font-size:11.5px;opacity:.8}
.wallet-card .wc-v{font-size:26px;font-weight:900;margin:4px 0 10px}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.tx:last-child{border:none;padding-bottom:0}
.tx .t-em{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.tx .t-n{font-size:12.5px;font-weight:700}
.tx .t-d{font-size:10px;color:var(--tiny)}
.tx .t-a{font-size:12.5px;font-weight:800;text-align:left}

/* تب‌ها */
.tabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs .tab{flex:1;text-align:center;padding:8px;border-radius:11px;font-size:12.5px;font-weight:800;color:var(--muted);transition:.15s}
.tabs .tab.on{background:var(--card);color:var(--primary);box-shadow:0 2px 8px rgba(15,23,42,.1)}

/* ================= گردونه شانس ================= */
.wheel-wrap{position:relative;width:312px;height:312px;margin:24px auto 10px}
.wheel-bulbs{position:absolute;inset:0;pointer-events:none;z-index:3}
.wheel-bulbs span{position:absolute;top:50%;left:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fde68a;box-shadow:0 0 8px 2px rgba(251,191,36,.6)}
.wheel-bulbs span:nth-child(odd){animation:twinkle 1.7s infinite}
.wheel-bulbs span:nth-child(even){animation:twinkle 1.7s .85s infinite}
@keyframes twinkle{0%,100%{opacity:1;box-shadow:0 0 8px 2px rgba(251,191,36,.6)}50%{opacity:.35;box-shadow:0 0 3px 1px rgba(251,191,36,.25)}}
.wheel{position:absolute;inset:15px;width:auto;height:auto;border-radius:50%;box-shadow:0 14px 44px rgba(0,0,0,.4),0 0 0 7px #fff,0 0 0 9px var(--border);transition:transform 4.4s cubic-bezier(.1,.68,.06,1)}
.wseg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.wseg span{position:absolute;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1.5px 3px rgba(0,0,0,.4);white-space:nowrap}
.wseps{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.3) 0deg 1.1deg,transparent 1.1deg 45deg);pointer-events:none}
.wheel-deep{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.3),transparent 50%),radial-gradient(circle at 72% 82%,rgba(0,0,0,.22),transparent 55%);pointer-events:none}
.wheel-pointer{position:absolute;top:-17px;left:50%;transform:translateX(-50%);z-index:6;filter:drop-shadow(0 4px 7px rgba(0,0,0,.35))}
.wheel-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff8db,#fbbf24 52%,#d97706);border:4px solid #fff;color:#7c2d12;font-size:14.5px;font-weight:900;z-index:4;box-shadow:0 7px 18px rgba(0,0,0,.35),inset 0 2px 8px rgba(255,255,255,.55),inset 0 -3px 6px rgba(120,53,15,.3)}
.wheel-hub:disabled{opacity:.75}
.wheel-hint{text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:14px}

/* ================= بازی کارت‌ها ================= */
.rar-common{--rc:#64748b}.rar-rare{--rc:#0284c7}.rar-epic{--rc:#7c3aed}.rar-legendary{--rc:#d97706}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ccell{aspect-ratio:3/4.1;border-radius:13px;border:2px solid var(--border);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;font-weight:700;color:var(--tiny);position:relative;overflow:hidden;padding:3px;text-align:center}

.ccell .c-r{font-size:8px;color:var(--rc,#64748b);font-weight:800}
.ccell .dup{position:absolute;top:2px;left:2px;font-size:9px}
.act{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin-bottom:9px}
.act .a-em{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto}
.act .a-n{font-weight:800;font-size:13px}
.act .a-d{font-size:11px;color:var(--muted)}
.act.done{opacity:.62}
.act .a-chk{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#dcfce7;color:#16a34a;flex:0 0 auto}
.pack-big{font-size:84px;text-align:center;animation:bounce 1.4s infinite}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.04)}}
.creveal{text-align:center;animation:flipIn .55s cubic-bezier(.2,.9,.3,1.4)}
@keyframes flipIn{0%{transform:rotateY(90deg) scale(.6);opacity:0}100%{transform:rotateY(0) scale(1);opacity:1}}
.bigcard{width:168px;height:224px;margin:10px auto;border-radius:18px;background:linear-gradient(160deg,var(--card),var(--soft));border:3px solid var(--rc,#64748b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 10px 30px rgba(15,23,42,.2);position:relative;overflow:hidden}
.bigcard .bc-em{font-size:58px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.bigcard .bc-n{font-weight:900;font-size:15px}
.bigcard .bc-r{font-size:11px;font-weight:800;color:var(--rc,#64748b)}
.bigcard.legendary::after{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,#fbbf24aa 85%,transparent 100%);animation:spinsh 3s linear infinite}
@keyframes spinsh{to{transform:rotate(360deg)}}
.setbar{height:7px;border-radius:4px;background:var(--border);overflow:hidden;flex:1}
.setbar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:4px}

/* ================= تقویم و ساعت‌ها ================= */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cday{border:1.5px solid var(--border);background:var(--soft);border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;transition:.15s}
.cday .cd-n{font-size:10px;color:var(--muted);font-weight:700}
.cday .cd-d{font-size:14px;font-weight:900;color:var(--text)}
.cday.on{background:var(--primary);border-color:var(--primary)}
.cday.on .cd-n,.cday.on .cd-d{color:#fff}
.cday:active{transform:scale(.95)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1.5px solid var(--border);background:var(--soft);border-radius:12px;padding:9px;text-align:center;font-weight:800;font-size:13px;cursor:pointer;transition:.15s;color:var(--text)}
.slot.on{background:var(--primary);border-color:var(--primary);color:#fff}
.slot.taken{opacity:.4;pointer-events:none;text-decoration:line-through;background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35)}

/* ================= پنل مدیر ================= */
.stat{background:var(--card);border-radius:18px;padding:13px;box-shadow:var(--shadow)}
.stat .st-l{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
.stat .st-v{font-size:17px;font-weight:900;margin-top:3px}
.stat .st-s{font-size:10px;margin-top:2px;font-weight:700}
.stat .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px}
.bars{display:flex;align-items:flex-end;gap:7px;height:132px;padding-top:20px}
.bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar{background:linear-gradient(180deg,var(--primary2),var(--primary));border-radius:7px 7px 0 0;position:relative;min-height:4px;transition:.3s}
.bar b{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:9px;color:var(--primary);white-space:nowrap}
.bar-lbl{text-align:center;font-size:9.5px;color:var(--muted);margin-top:5px;font-weight:700}
.donut-wrap{display:flex;align-items:center;gap:14px}
.donut{width:118px;height:118px;border-radius:50%;position:relative;flex:0 0 auto}
.donut::after{content:'';position:absolute;inset:25px;background:var(--card);border-radius:50%}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;font-size:10px}
.donut-c b{font-size:13px}
.legend{font-size:11.5px;display:flex;flex-direction:column;gap:6px;flex:1;color:var(--text)}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:3px}
.custrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin-bottom:9px}
.custrow .rank{width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;background:var(--soft);color:var(--muted);flex:0 0 auto}
.custrow .rank.r1{background:#fef3c7;color:#d97706}.custrow .rank.r2{background:#e2e8f0;color:#475569}.custrow .rank.r3{background:#ffedd5;color:#c2410c}
.custrow .cn{font-weight:800;font-size:13px}
.custrow .cp{font-size:10.5px;color:var(--tiny)}
.custrow .cv{text-align:left;font-size:12.5px;font-weight:900;color:var(--primary)}
.custrow .cv small{display:block;font-size:9.5px;color:var(--tiny);font-weight:700}

/* ================= مودال و توست ================= */
#modalHost .ovl{position:absolute;inset:0;background:rgba(8,12,24,.55);backdrop-filter:blur(3px);z-index:70;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#modalHost .sheet{background:var(--card);width:100%;max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px 22px;animation:slideUp .28s cubic-bezier(.2,.8,.25,1);color:var(--text)}
#modalHost .sheet.mid{align-items:center;border-radius:24px;margin:0 18px;width:calc(100% - 36px);max-height:86%}
@keyframes slideUp{from{transform:translateY(60px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-h .sh-t{font-size:15.5px;font-weight:900}
.sheet-x{width:32px;height:32px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
#toastHost{position:absolute;top:16px;left:0;right:0;z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#1e293b;color:#fff;font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.3);max-width:86%;text-align:center;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.3)}
.toast.ok{background:#065f46}.toast.err{background:#9f1239}.toast.warn{background:#92400e}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function faNum(n){return Number(n||0).toLocaleString('fa-IR')}
function money(n){return faNum(Math.round(n))+' تومان'}
function faD(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function fmtDate(ts){return new Date(ts).toLocaleDateString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'})}
function fmtTime(ts){return new Date(ts).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}
function fmtDT(ts){return fmtDate(ts)+' ساعت '+fmtTime(ts)}
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);d.setHours(9+((n*5)%9),(n*17)%60,0,0);return d.getTime()}
function midnightPlus(n){const d=new Date();d.setDate(d.getDate()+n);d.setHours(0,0,0,0);return d.getTime()}
function uid(p){return p+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickW(items,wkey){const tot=items.reduce((s,i)=>s+i[wkey],0);let r=Math.random()*tot;for(const it of items){r-=it[wkey];if(r<=0)return it}return items[items.length-1]}
function digitsOnly(s){return String(s||'').replace(/[^\d]/g,'')}
function fmtCard(no){return digitsOnly(no).replace(/(\d{4})(?=\d)/g,'$1-')}

function notify(uid_,em,txt){db.notifs.unshift({id:uid('n'),uid:uid_,em:em,txt:txt,at:Date.now(),read:false});if(db.notifs.length>60)db.notifs.pop()}
function notifsOf(uid_){return db.notifs.filter(n=>n.uid===uid_)}
function unreadCount(uid_){return notifsOf(uid_).filter(n=>!n.read).length}
function addTx(u,type,amount,note){db.txs.unshift({id:uid('t'),uid:u.id,type:type,amount:amount,at:Date.now(),note:note})}
function ordersOf(uid_){return db.orders.filter(o=>o.customerId===uid_)}
function userStats(uid_){
  const os=ordersOf(uid_).filter(o=>o.status!=='cancelled');
  const rev=os.reduce((s,o)=>s+o.price,0);
  const prof=os.reduce((s,o)=>s+(o.price-o.cost),0);
  return {rev:rev,prof:prof,cnt:os.length};
}
function custRevenue7(){
  const days=[];for(let i=6;i>=0;i--){const ts=midnightPlus(-i);const sum=db.txs.filter(t=>t.type==='payment'&&dayKey(t.at)===dayKey(ts)).reduce((s,t)=>s+t.amount,0);days.push({ts:ts,sum:sum})}
  return days;
}

function doCustomerAuth(){
  const name=(document.getElementById('aName').value||'').trim();
  const un=(document.getElementById('aUser').value||'').trim();
  const pw=(document.getElementById('aPass').value||'').trim();
  const ph=digitsOnly(document.getElementById('aPhone').value);
  if(!/^[^\s]{3,20}$/.test(un)){toast('نام کاربری باید ۳ تا ۲۰ کاراکتر و بدون فاصله باشد','err');return}
  if(pw.length<4){toast('گذرواژه باید حداقل ۴ کاراکتر باشد','err');return}
  if(!/^\d{10,11}$/.test(ph)||(ph.length===11&&!ph.startsWith('09'))||(ph.length===10&&!ph.startsWith('9'))){toast('شماره تماس معتبر نیست — مثل: 09121234567','err');return}
  const phone=ph.length===10?'0'+ph:ph;
  const exist=db.users.find(x=>x.role==='customer'&&x.username===un);
  if(exist){
    if(exist.pass!==pw){toast('گذرواژه این نام کاربری اشتباه است','err');return}
    if(phone!==exist.phone){exist.phone=phone;toast('شماره تماس پروفایل به‌روزرسانی شد','ok')}
    if(name&&name!==exist.name){exist.name=name}
    loginCustomer(exist);toast('خوش برگشتی، '+exist.name+' 👋','ok');
    return;
  }
  if(!name){toast('برای ثبت‌نام، نام و نام خانوادگی را هم وارد کنید','err');return}
  const u={id:uid('u'),role:'customer',username:un,pass:pw,name:name,phone:phone,wallet:0,points:0,acts:{},packs:0,cards:[],setRewards:{},invites:0,streak:0,lastLogin:0,refCode:'SK'+Math.floor(1000+Math.random()*9000),joined:Date.now(),nameEdited:true};
  db.users.push(u);
  notify(u.id,'👋','ثبت‌نام شما با موفقیت انجام شد! خوش آمدید.');
  loginCustomer(u);toast('ثبت‌نام انجام شد — خوش آمدید 🎉','ok');
}

function openPay(sid){
  const s=svc(sid);const u=cu();

  if(!name){toast('نام را وارد کنید','err');return}

  if(s.needMelli&&!/^\d{10}$/.test(melli)){toast('کد ملی باید ۱۰ رقم باشد','err');return}
  if(s.needFile&&!(S.form.files||[]).length){toast('برای این خدمت، پیوست مدارک الزامی است','err');return}
  S.form.name=name;S.form.melli=melli;S.form.note=($('#fNote')?document.getElementById('fNote').value.trim():'');

  modal(sheetHead('روش پرداخت — '+money(s.price))+
    '<button class="payopt '+(enough?'on':'')+'" '+(enough?'onclick="confirmPay(\'wallet\')"':'')+'><span class="em">👛</span><span style="flex:1">کیف پول ثبتینو<small>موجودی: '+faNum(u.wallet)+' تومان'+(enough?'':' — کافی نیست (کمبود '+faNum(s.price-u.wallet)+' تومان)')+'</small></span><span class="radio-dot"></span></button>'+
    '<button class="payopt" onclick="confirmPay(\'online\')"><span class="em">🏦</span><span style="flex:1">پرداخت اینترنتی<small>درگاه بانکی امن (شبیه‌سازی)</small></span><span class="radio-dot"></span></button>'+
    (enough?'':'<button class="btn btn-o" onclick="closeModal();navTo(\'wallet\')">💳 شارژ کیف پول</button>'),'mid');
}
function confirmPay(method){
  const s=svc(S.params.id);const u=cu();
  if(method==='wallet'&&u.wallet<s.price){toast('موجودی کیف پول کافی نیست','err');return}
  S.payMethod=method;
  if(method==='online'){gatewaySim(s.price,'finishOrder()');return}
  finishOrder();
}

function createOrder(s,u,nextStatus){
  const method=S.payMethod||'online';

  const o={id:uid('o'),code:'SK-'+(++db.meta.seq),type:'order',serviceId:s.id,customerId:u.id,price:s.price,cost:s.cost,status:'submitted',pay:method,createdAt:now,file:files.length?files.join(' ، '):null,fileCount:files.length,note:S.form.note,melli:S.form.melli,tl:[{st:'submitted',at:now}]};

const SLOT_TIMES=['9:00','10:30','12:00','14:00','15:30','17:00','18:30'];
function slotTaken(dayTs,slot){
  const key=dayKey(dayTs);
  if(db.orders.some(o=>o.type==='appointment'&&o.status==='booked'&&dayKey(o.appointDate)===key&&o.slot===slot))return true;
  let hash=0;const str=key+slot;for(let i=0;i<str.length;i++)hash=(hash*31+str.charCodeAt(i))>>>0;
  return hash%4===0;
}
function screenApptForm(){
  const s=svc(S.params.id);
  S.apptDay=S.apptDay||0;S.apptSlot=S.apptSlot||null;

  h+='<div class="pad">';
  h+='<div class="card"><div class="card-t">📅 انتخاب روز</div><div class="cal">'+daysHTML()+'</div></div>';
  h+='<div class="card"><div class="card-t">⏰ انتخاب ساعت</div><div class="slots">'+SLOT_TIMES.map(t=>{const taken=slotTaken(midnightPlus(S.apptDay),t);return '<button class="slot '+(S.apptSlot===t?'on':'')+(taken?' taken':'')+'" '+(taken?'':'onclick="S.apptSlot=\''+t+'\';render()"')+'>'+faD(t)+'</button>'}).join('')+'</div><div class="tiny mt10">🕐 ساعت‌های خط‌خورده قبلاً رزرو شده‌اند</div></div>';

  h+='<button class="btn btn-p" onclick="confirmAppt(\''+s.id+'\')">تأیید و رزرو نوبت</button>';
  h+='</div>';

function daysHTML(){
  let out='';
  for(let i=0;i<7;i++){
    const ts=midnightPlus(i);const d=new Date(ts);
    const wd=d.toLocaleDateString('fa-IR',{weekday:'short'});
    const day=d.getDate();
    out+='<button class="cday '+(S.apptDay===i?'on':'')+'" onclick="S.apptDay='+i+';S.apptSlot=null;render()"><div class="cd-n">'+(i===0?'امروز':i===1?'فردا':wd)+'</div><div class="cd-d">'+faNum(day)+'</div></button>';
  }
  return out;
}
function confirmAppt(sid){
  if(S.apptSlot===null){toast('لطفاً یک ساعت را انتخاب کنید','err');return}
  const s=svc(sid);const u=cu();
  if(slotTaken(midnightPlus(S.apptDay),S.apptSlot)){toast('این ساعت همین الان رزرو شد؛ ساعت دیگری انتخاب کنید','err');S.apptSlot=null;render();return}
  const now=Date.now();
  const o={id:uid('o'),code:'SK-'+(++db.meta.seq),type:'appointment',serviceId:sid,customerId:u.id,price:s.price,cost:s.cost,status:'booked',pay:'onsite',createdAt:now,appointDate:midnightPlus(S.apptDay),slot:S.apptSlot,tl:[{st:'booked',at:now}]};

  save();toast('نوبت شما رزرو شد 🎉','ok');

  return h;

function spinNow(){
  if(S.spin)return;
  const u=cu();
  const today=dayKey(Date.now());
  const isFree=u.lastSpinDay!==today;
  if(!isFree){
    if(u.points<300){toast('امتیاز کافی ندارید (۳۰۰ امتیاز لازم است)','err');return}
    u.points-=300;
  }
  u.lastSpinDay=today;
  S.spin=true;
  const hub=document.getElementById('spinHub');if(hub)hub.disabled=true;
  const win=pickW(WHEEL,'w');
  const i=WHEEL.indexOf(win);
  const target=5*360+(360-(i*45+22.5))+Math.floor(Math.random()*22-11);
  spinDeg+=target-(spinDeg%360);
  const el=document.getElementById('wheelEl');
  el.style.transform='rotate('+spinDeg+'deg)';
  setTimeout(function(){
    S.spin=false;
    if(win.type==='points'){u.points+=win.v;notify(u.id,'🎡','جایزه گردونه: +'+faNum(win.v)+' امتیاز')}
    else if(win.type==='credit'){u.wallet+=win.v;addTx(u,'prize',win.v,'جایزه گردونه شانس');notify(u.id,'🎡','جایزه گردونه: '+faNum(win.v)+' تومان اعتبار به کیف پول اضافه شد')}
    save();
    if(win.type==='none'){
      modal('<div class="center" style="padding:10px 0"><div style="font-size:52px">😅</div><div class="bold mt6" style="font-size:16px">این‌بار شانست نیامد!</div><div class="muted mt6">فردا دوباره چرخش رایگان داری</div><button class="btn btn-o mt14" onclick="closeModal();render()">باشه</button></div>','mid');
    }else{
      modal('<div class="center" style="padding:10px 0"><div style="font-size:52px">🎉</div><div class="bold mt6" style="font-size:17px">تبریک! جایزه شما:</div><div class="mt10" style="font-size:26px;font-weight:900;color:var(--primary)">'+win.label+'</div><div class="muted mt6">'+(win.type==='points'?'امتیاز مستقیم به حساب شما اضافه شد ⭐':'اعتبار مستقیم به کیف پول شما اضافه شد 💳')+'</div><button class="btn btn-p mt14" onclick="closeModal();render()">عالیه!</button></div>','mid');
    }
    render();
    const el2=document.getElementById('wheelEl');
    if(el2)el2.insertAdjacentHTML('beforeend','<div class="wflash" style="position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(255,255,255,.5) '+(i*45)+'deg '+((i+1)*45)+'deg,transparent '+((i+1)*45)+'deg 360deg);animation:wfade 1.5s forwards"></div>');
  },4600);
}

function tapPack(){
  const u=cu();
  if(u.packs<1)return;
  u.packs--;
  const roll=Math.random();
  let rar='common';
  let acc=0;
  for(const[r,w]of[['legendary',.04],['epic',.13],['rare',.25],['common',.58]]){acc+=w;if(roll<acc){rar=r;break}}
  const pool=CARDS.filter(c=>c.r===rar);
  const card=pool[Math.floor(Math.random()*pool.length)];
  const dup=u.cards.some(x=>x.id===card.id);
  S.pack=card;
  modal('<div class="creveal"><div class="bigcard rar-'+card.r+'"><span class="bc-em">'+card.emoji+'</span><span class="bc-n">'+card.name+'</span><span class="bc-r">'+RARITY[card.r]+'</span>'+(dup?'<span class="tiny red">تکراری!</span>':'')+'</div><button class="btn btn-p mt10" onclick="collectPack()">افزودن به آلبوم ✔</button></div>','mid');
}
function collectPack(){
  const card=S.pack;if(!card)return;
  const u=cu();
  const dup=u.cards.some(x=>x.id===card.id);
  if(dup){u.points+=20;notify(u.id,'🎴','کارت تکراری «'+card.name+'» به ۲۰ امتیاز تبدیل شد')}
  else{
    u.cards.push({id:card.id,at:Date.now()});
    notify(u.id,'🎴','کارت جدید «'+card.name+'» ('+RARITY[card.r]+') به آلبوم شما اضافه شد!');
    const setCards=CARDS.filter(c=>c.set===card.set);
    const ownedAll=setCards.every(c=>u.cards.some(x=>x.id===c.id));
    if(ownedAll&&!u.setRewards[card.set]){toast('ست کامل شد! جایزه در انتظار شماست 🏆','ok')}
  }
  save();S.pack=null;closeModal();render();
  if(!dup)setTimeout(()=>{const u2=cu();const setCards2=CARDS.filter(c=>c.set===card.set);const full=setCards2.every(c=>u2.cards.some(x=>x.id===c.id));if(full&&!u2.setRewards[card.set]){modal(sheetHead('🏆 ست کامل شد!')+'<div class="center"><div style="font-size:46px">'+SETS.find(s=>s.id===card.set).emoji+'</div><div class="bold mt6">ست «'+SETS.find(s=>s.id===card.set).name+'» کامل شد!</div><div class="muted mt6">جایزه: <b class="green">'+faNum(SETS.find(s=>s.id===card.set).reward.credit)+' تومان</b> + <b class="amber">'+faNum(SETS.find(s=>s.id===card.set).reward.points)+' امتیاز</b></div><button class="btn btn-g mt14" onclick="claimSet(\''+card.set+'\')">دریافت جایزه</button></div>','mid')}},400);
}
function claimSet(setId){
  const set=SETS.find(s=>s.id===setId);const u=cu();
  const setCards=CARDS.filter(c=>c.set===setId);
  if(!setCards.every(c=>u.cards.some(x=>x.id===c.id))){toast('ست هنوز کامل نشده','warn');return}
  if(u.setRewards[setId]){toast('جایزه این ست قبلاً دریافت شده','warn');return}
  u.setRewards[setId]=true;
  u.wallet+=set.reward.credit;u.points+=set.reward.points;
  addTx(u,'prize',set.reward.credit,'جایزه ست کامل کارت‌ها — '+set.name);
  notify(u.id,'🏆','جایزه ست کامل «'+set.name+'»: '+faNum(set.reward.credit)+' تومان به کیف پول اضافه شد');
  save();closeModal();toast('🎉 جایزه ست به کیف پول اضافه شد','ok');render();
}

function finActivity(id){
  const u=cu();
  if(id==='review'&&!S.stars){toast('لطفاً امتیاز ستاره‌ای انتخاب کنید','err');return}
  u.acts[id]=(u.acts[id]||0)+1;

  if(id==='review'){u.points+=30;notify(u.id,'⭐','دیدگاه شما ثبت شد (+۳۰ امتیاز + پک کارت)')}

  h+='<div class="grid2"><div class="stat"><div class="st-l">👥 مشتریان</div><div class="st-v">'+faNum(custCnt)+'</div></div><div class="stat"><div class="st-l">📅 نوبت‌های پیش‌رو</div><div class="st-v">'+faNum(apptNext)+'</div></div></div>';

let acustBack='adash';

  const os=db.orders.filter(o=>o.type==='order').filter(o=>{
    if(S.ordFilter==='all')return true;

  let h=aHead('مدیریت سفارش‌ها');
  h+='<div class="pad">';
  h+='<div class="chips">'+filters.map(f=>'<button class="chip '+(S.ordFilter===f[0]?'on':'')+'" onclick="S.ordFilter=\''+f[0]+'\';render()">'+f[1]+'</button>').join('')+'</div>';
  if(!os.length)h+='<div class="empty"><div class="e-em">🫙</div><div class="e-t">سفارشی در این وضعیت نیست</div></div>';

function orderDetailAdmin(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;

  const idx=STEPS.indexOf(o.status);

  modal(sheetHead('سفارش '+o.code)+

    '<div class="sumbox" style="margin-bottom:10px">'+
    '<div class="sumrow"><span class="muted">درآمد</span><span class="bold indigo">'+money(o.price)+'</span></div>'+
    '<div class="sumrow"><span class="muted">هزینه تمام‌شده</span><span class="red">−'+money(o.cost)+'</span></div>'+
    '<div class="sumrow"><span class="muted">سود این سفارش</span><span class="bold green">'+money(o.price-o.cost)+'</span></div>'+
    '<div class="sumrow"><span class="muted">پرداخت</span><span>'+(o.pay==='wallet'?'کیف پول':o.pay==='online'?'درگاه':'در محل')+'</span></div>'+
    (o.melli?'<div class="sumrow"><span class="muted">کد ملی</span><span style="direction:ltr">'+esc(o.melli)+'</span></div>':'')+
    (o.file?'<div class="sumrow"><span class="muted">پیوست‌های مشتری</span><span style="font-size:11.5px">📎 '+esc(o.file)+'</span></div>':'')+
    (o.note?'<div class="sumrow"><span class="muted">توضیح</span><span style="font-size:11.5px">'+esc(o.note)+'</span></div>':'')+'</div>'+
    '<div class="tiny" style="margin-bottom:6px">مراحل:</div><div class="tl">'+o.tl.map(t=>'<div class="tl-item done"><span class="tl-dot"></span><div class="t-n">'+(ST_LABEL[t.st]||t.st)+'</div><div class="t-d">'+fmtDT(t.at)+(t.note?' — '+esc(t.note):'')+'</div></div>').join('')+'</div>'+
    (next?'<button class="btn btn-p mt10" onclick="advanceOrder(\''+o.id+'\')">➡️ ثبت مرحله بعد: «'+STEP_LABEL[next]+'»</button>':'')+
    (!['cancelled','delivered'].includes(o.status)?'<button class="btn btn-d mt10" onclick="adminCancel(\''+o.id+'\')">❌ لغو سفارش</button>':'')+
    '<button class="btn btn-o mt10" onclick="closeModal()">بستن</button>');
}
function advanceOrder(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  const idx=STEPS.indexOf(o.status);const next=STEPS[idx+1];if(!next)return;
  const u=user(o.customerId);
  o.status=next;o.tl.push({st:next,at:Date.now()});
  if(u){
    if(next==='delivered'){u.points+=20;u.packs=(u.packs||0)+1;notify(u.id,'🎉','سفارش '+o.code+' تحویل شد! +۲۰ امتیاز و ۱ پک کارت هدیه')}
    else notify(u.id,'🔄','وضعیت سفارش '+o.code+' به «'+STEP_LABEL[next]+'» تغییر کرد');
  }
  save();closeModal();toast('وضعیت به «'+STEP_LABEL[next]+'» تغییر کرد — مشتری مطلع شد','ok');render();
}
function adminCancel(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  const u=user(o.customerId);
  o.status='cancelled';o.tl.push({st:'cancelled',at:Date.now(),note:'لغو توسط مدیر'});
  if(u){if(o.pay==='wallet'){u.wallet+=o.price;addTx(u,'refund',o.price,'بازگشت وجه سفارش '+o.code)}notify(u.id,'❌','سفارش '+o.code+' لغو شد'+(o.pay==='wallet'?' و وجه به کیف پول بازگشت':''))}
  save();closeModal();toast('سفارش لغو شد','warn');render();
}
function screenACustomers(){
  const q=(S.aq||'').trim();

  if(q)rows=rows.filter(r=>r.u.name.includes(q)||r.u.phone.includes(q));

  h+='<div class="card row" style="background:linear-gradient(130deg,#312e81,#4f46e5);color:#fff;border:none"><div><div class="tiny" style="opacity:.8">مجموع درآمد از '+faNum(rows.length)+' مشتری</div><div class="bold" style="font-size:18px">'+faNum(rows.reduce((s,r)=>s+r.st.rev,0))+' تومان</div></div><div class="sp"></div><div class="center"><div class="tiny" style="opacity:.8">مجموع سود</div><div class="bold" style="font-size:16px">'+faNum(rows.reduce((s,r)=>s+r.st.prof,0))+' تومان</div></div></div>';

function renderACustList(){
  const q=(S.aq||'').trim();
  let rows=db.users.filter(u=>u.role==='customer').map(u=>({u:u,st:userStats(u.id)}));
  if(q)rows=rows.filter(r=>r.u.name.includes(q)||r.u.phone.includes(q));
  rows.sort((a,b)=>b.st.rev-a.st.rev);
  const el=document.getElementById('acustList');
  if(el)el.innerHTML=acustListHTML(rows,rows.reduce((s,r)=>s+r.st.rev,0)||1);

function acustListHTML(rows,totRev){
  if(!rows.length)return '<div class="empty"><div class="e-em">🔍</div><div class="e-t">مشتری پیدا نشد</div></div>';

    const share=Math.round(r.st.rev/totRev*100);
    return '<button class="custrow" style="width:100%;text-align:right" onclick="go(\'acustdetail\',{id:\''+r.u.id+'\'})">'+
    '<div class="rank '+(i<3?'r'+(i+1):'')+'">'+faNum(i+1)+'</div>'+
    '<div style="flex:1;min-width:0"><div class="cn">'+esc(r.u.name)+'</div><div class="cp" style="direction:ltr;text-align:right">'+r.u.phone+' • '+faNum(r.st.cnt)+' سفارش • سهم '+faNum(share)+'٪</div></div>'+
    '<div class="cv">'+faNum(r.st.rev)+' <small style="font-size:9px">تومان</small><small>سود: '+faNum(r.st.prof)+'</small></div></button>';
  }).join('');
}

function markAttended(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  const u=user(o.customerId);
  o.status='attended';o.tl.push({st:'attended',at:Date.now()});
  if(u){u.points+=10;notify(u.id,'✅','حضور شما برای نوبت '+fmtDate(o.appointDate)+' ثبت شد (+۱۰ امتیاز)')}
  save();toast('حضور ثبت شد — مشتری +۱۰ امتیاز گرفت','ok');render();
}
function cancelAppt(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  const u=user(o.customerId);
  o.status='cancelled';o.tl.push({st:'cancelled',at:Date.now(),note:'لغو توسط مدیر'});
  if(u)notify(u.id,'❌','نوبت شما در '+fmtDate(o.appointDate)+' لغو شد. برای رزرو مجدد تماس بگیرید.');
  save();toast('نوبت لغو شد','warn');render();
}

/* ---------- پیام مدیر به مشتری ---------- */
function sendMsgTo(uid_){
  const u=user(uid_);if(!u)return;
  S.msgIcon=S.msgIcon||'💌';
  const icons=['💌','📞','📢','⚠️','✅','🎉'];
  modal(sheetHead('✉️ ارسال پیام به '+esc(u.name))+
    '<div class="tiny mb10">این پیام بلافاصله به‌صورت اعلان در اپ مشتری نمایش داده می‌شود.</div>'+
    '<div class="row" style="gap:8px;margin-bottom:10px">'+icons.map(ic=>'<button class="msg-ico '+(S.msgIcon===ic?'on':'')+'" onclick="S.msgIcon=\''+ic+'\';sendMsgTo(\''+uid_+'\')">'+ic+'</button>').join('')+'</div>'+
    '<div class="field"><textarea id="msgTxt" placeholder="متن پیام... مثلاً: مدارک شما تأیید شد و سفارش در حال انجام است."></textarea></div>'+
    '<button class="btn btn-p" onclick="sendMsgNow(\''+uid_+'\')">'+I.send+' ارسال پیام</button>','mid');
}
function sendMsgNow(uid_){
  const txt=($('#msgTxt')?document.getElementById('msgTxt').value.trim():'');
  if(!txt){toast('متن پیام را بنویسید','err');return}
  const u=user(uid_);
  notify(uid_,S.msgIcon||'💌',txt);
  save();closeModal();
  toast('پیام برای '+u.name+' ارسال شد ✅','ok');
  render();
}
/* ---------- شماره کارت واریز ---------- */
function cardSettings(){
  const st=db.settings||{cardNo:'',cardHolder:'',cardBank:''};
  modal(sheetHead('💳 شماره کارت دریافت واریز')+
    '<div class="tiny mb10">این کارت در بخش شارژ کیف پول مشتری‌ها نمایش داده می‌شود (کارت‌به‌کارت).</div>'+
    '<div class="field"><label>شماره کارت (فقط عدد، ۱۶ تا ۲۴ رقم)</label><input id="cardNo" inputmode="numeric" value="'+esc(st.cardNo||'')+'" style="direction:ltr;text-align:left" oninput="this.value=digitsOnly(this.value).slice(0,24)" placeholder="6219861012345678"></div>'+
    '<div class="field"><label>به نام</label><input id="cardHolder" value="'+esc(st.cardHolder||'')+'" placeholder="مثلاً: مدیریت ثبتینو"></div>'+
    '<div class="field"><label>نام بانک</label><input id="cardBank" value="'+esc(st.cardBank||'')+'" placeholder="مثلاً: بانک سامان"></div>'+
    '<button class="btn btn-p" onclick="cardSave()">ذخیره شماره کارت</button>','mid');
}
function cardSave(){
  const no=digitsOnly(($('#cardNo')?document.getElementById('cardNo').value:'')||'');
  const holder=($('#cardHolder')?document.getElementById('cardHolder').value.trim():'');
  const bank=($('#cardBank')?document.getElementById('cardBank').value.trim():'');
  if(!no||no.length<16||no.length>24){toast('شماره کارت باید ۱۶ تا ۲۴ رقم عدد باشد','err');return}
  if(!holder){toast('نام صاحب کارت را وارد کنید','err');return}
  db.settings={cardNo:no,cardHolder:holder,cardBank:bank||'—'};
  save();closeModal();toast('شماره کارت ذخیره شد ✅','ok');render();
}

/* ================= INIT ================= */
function init(){
  applyTheme();
  db=load();
  if(!db||!db.users||!db.orders){db=seedDB();save()}
  if(!db.settings)db.settings={cardNo:'',cardHolder:'',cardBank:''};
  if(db.session&&db.session.role==='admin'){S.route='adash'}
  else if(db.session&&db.session.role==='customer'){if(cu()){dailyBonus(cu());S.route='home'}else{db.session=null;S.route='login'}}
  else S.route='login';
  render();
}
init();
